# Apply this foundation before rendering the catalog. It provides shared
# settings and the database/cache used by all 50 application services.
apiVersion: v1
kind: Namespace
metadata:
  name: railshack
---
# Non-sensitive environment settings shared by the application pods.
apiVersion: v1
kind: ConfigMap
metadata:
  name: railshack-app
  namespace: railshack
data:
  APP_ENV: local
  CLUSTER_NAME: local-kind
  PORT: "8080"
  REDIS_ADDR: redis:6379
  SERVICES_FILE: /app/services.json
  POSTGRES_DB: railshack
---
# Local-only database credentials. stringData is plain text in this file;
# do not reuse these values outside the learning cluster.
apiVersion: v1
kind: Secret
metadata:
  name: railshack-local
  namespace: railshack
type: Opaque
stringData:
  POSTGRES_USER: railshack
  POSTGRES_PASSWORD: railshack-local
  DATABASE_URL: postgres://railshack:railshack-local@postgres:5432/railshack?sslmode=disable
---
# A Deployment keeps one PostgreSQL pod running and replaces it if it exits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: railshack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: railshack-app
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: railshack-local
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: railshack-local
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          # Mark Postgres ready only after it accepts connections.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "railshack", "-d", "railshack"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "railshack", "-d", "railshack"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          # emptyDir is deleted with the pod, so data does not survive pod replacement.
          emptyDir: {}
---
# This internal Service gives app pods the stable address postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: railshack
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Redis is the shared cache. Its data is disposable and can be rebuilt after
# a restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: railshack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          # Do not send cache requests until Redis responds to PING.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
---
# This internal Service gives app pods the stable address redis:6379.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: railshack
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
