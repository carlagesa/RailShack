# CI validates and smoke-tests the application. It does not build or publish images.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railshack
          POSTGRES_USER: railshack
          POSTGRES_PASSWORD: local-test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U railshack" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgres://railshack:local-test-password@localhost:5432/railshack?sslmode=disable
      REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Vet Go services
        run: for d in libs/gokit services/*/; do [ ! -f "$d/go.mod" ] || (cd "$d" && go vet ./...); done
      - name: Syntax-check Node and Python services
        run: |
          for f in services/*/index.js libs/nodekit/railshack-kit/index.js services/frontend/public/app.js; do node --check "$f"; done
          python3 -m py_compile libs/pykit/railkit.py services/*/app.py
      - name: Start all 50 services
        run: bash scripts/start-services.sh
      - name: End-to-end smoke test
        run: bash scripts/smoke-test.sh http://localhost:9050
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: .run/logs
