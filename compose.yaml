name: railshack

x-app-service: &app-service
  init: true
  restart: unless-stopped
  environment: &app-environment
    PORT: "8080"
    APP_ENV: local
    CLUSTER_NAME: local-docker
    DATABASE_URL: postgres://railshack:railshack-local@postgres:5432/railshack?sslmode=disable
    REDIS_ADDR: redis:6379
    SERVICES_FILE: /app/services.json
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - app

x-build-go: &build-go
  context: .
  dockerfile: docker/Dockerfile.go

x-build-node: &build-node
  context: .
  dockerfile: docker/Dockerfile.node

x-build-python: &build-python
  context: .
  dockerfile: docker/Dockerfile.python

x-build-java: &build-java
  context: .
  dockerfile: docker/Dockerfile.java

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: railshack
      POSTGRES_USER: railshack
      POSTGRES_PASSWORD: railshack-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railshack -d railshack"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app

  auth:
    <<: *app-service
    build:
      <<: *build-go
      args:
        SERVICE: auth

  user-profile:
    <<: *app-service
    build:
      <<: *build-node
      args:
        SERVICE: user-profile

  passengers:
